plugins {
    id 'com.android.application'
}

android {
    namespace 'com.foonyresso.ouravex'
    compileSdk 34

    defaultConfig {
        applicationId 'com.foonyresso.ouravex'
        minSdk project.hasProperty('lowSdk') ? 22 : 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        ouravex {
            storeFile file('../ouravex.jks')
            storePassword 'ouravex-game'
            keyAlias 'ouravex'
            keyPassword 'ouravex-game'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    signingConfigs {
        zv {
            storeFile file('../zv.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.zv
        }
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.zv
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
