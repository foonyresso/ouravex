name: Build APK

on:
  push:
    paths:
      - 'android-game/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-game
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-game/app/build/outputs/apk/debug/app-debug.apk ouravex.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ouravex.apk \
            --title "Ouravex (latest build)" \
            --notes "Debug APK, build #${{ github.run_number }}" \
            --target "${{ github.sha }}"
