name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android-game/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build game.dex and APK
        shell: bash
        run: |
          set -o pipefail
          {
            VC=$((${{ github.run_number }} + 10))
            AJ=$ANDROID_HOME/platforms/android-34/android.jar
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            mkdir -p "$RUNNER_TEMP/cls" "$RUNNER_TEMP/dexout"
            javac --release 11 -encoding UTF-8 -cp "$AJ" -d "$RUNNER_TEMP/cls" $(find android-game/game -name '*.java')
            $BT/d8 --lib "$AJ" --min-api 24 --output "$RUNNER_TEMP/dexout" $(find "$RUNNER_TEMP/cls" -name '*.class')
            cp "$RUNNER_TEMP/dexout/classes.dex" "$RUNNER_TEMP/game.dex"
            SHA=$(sha256sum "$RUNNER_TEMP/game.dex" | cut -d' ' -f1)
            echo "{\"code\":$VC,\"name\":\"1.$VC\",\"minHost\":1,\"sha\":\"$SHA\"}" > "$RUNNER_TEMP/game.json"
            mkdir -p android-game/app/src/main/assets
            cp "$RUNNER_TEMP/game.dex" "$RUNNER_TEMP/game.json" android-game/app/src/main/assets/
            cd android-game
            gradle assembleRelease -Pvcode=$VC -Pvname=1.$VC --no-daemon --console=plain
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ouravex-a.apk"
          } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Save build log to ci-log branch
        if: always()
        shell: bash
        run: |
          tail -n 250 "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/short.log" || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --quiet . || true
          cp "$RUNNER_TEMP/short.log" build.log
          git add build.log
          git commit -q -m "build log ${{ github.sha }}"
          git push -f origin ci-log

      - name: Publish to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -f "${{ github.sha }}"
          cp "$RUNNER_TEMP/ouravex-a.apk" ouravex-a.apk
          cp "$RUNNER_TEMP/game.json" game.json
          cp "$RUNNER_TEMP/game.dex" game.dex
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ouravex-a.apk game.dex game.json \
            --title "Ouravex (latest build)" \
            --notes "Auto-update source. Build #${{ github.run_number }}" \
            --target "${{ github.sha }}"
