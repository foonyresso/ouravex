name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android-game/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        shell: bash
        working-directory: android-game
        run: |
          set -o pipefail
          VC=$((${{ github.run_number }} + 10))
          gradle assembleRelease -Pvcode=$VC -Pvname=1.$VC --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ouravex-a.apk"
          echo "{\"code\":$VC,\"name\":\"1.$VC\"}" > "$RUNNER_TEMP/version.json"

      - name: Save build log to ci-log branch
        if: always()
        shell: bash
        run: |
          tail -n 250 "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/short.log" || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --quiet . || true
          cp "$RUNNER_TEMP/short.log" build.log
          git add build.log
          git commit -q -m "build log ${{ github.sha }}"
          git push -f origin ci-log

      - name: Publish to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -f "${{ github.sha }}"
          cp "$RUNNER_TEMP/ouravex-a.apk" ouravex-a.apk
          cp "$RUNNER_TEMP/version.json" version.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ouravex-a.apk version.json \
            --title "Ouravex (latest build)" \
            --notes "Auto-update source. Build #${{ github.run_number }}" \
            --target "${{ github.sha }}"
