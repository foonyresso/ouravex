name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android-game/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: android-game
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ouravex-a.apk"
          gradle assembleDebug -PlowSdk=true --no-daemon --console=plain 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/ouravex-b.apk"

      - name: Save build log to ci-log branch
        if: always()
        shell: bash
        run: |
          tail -n 250 "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/short.log" || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --quiet . || true
          cp "$RUNNER_TEMP/short.log" build.log
          git add build.log
          git commit -q -m "build log ${{ github.sha }}"
          git push -f origin ci-log

      - name: Publish to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -f "${{ github.sha }}"
          cp "$RUNNER_TEMP/ouravex-a.apk" ouravex-a.apk
          cp "$RUNNER_TEMP/ouravex-b.apk" ouravex-b.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ouravex-a.apk ouravex-b.apk \
            --title "Ouravex (latest build)" \
            --notes "A: release (icon). B: debug, minSdk 22 + permissions (zvuchar-like). Build #${{ github.run_number }}" \
            --target "${{ github.sha }}"
